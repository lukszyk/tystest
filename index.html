<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Licznik Punktów - Tysiąc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="p-3 sm:p-5 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-2xl mx-auto">
        <header class="text-center mb-4">
            <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-200 to-amber-300">
                ♠ Tysiąc Licznik ♣
            </h1>
        </header>

        <!-- EKRAN USTAWIEŃ POCZĄTKOWYCH -->
        <div id="setup-screen" class="card space-y-4">
            <h2 class="text-base font-bold text-emerald-400 uppercase tracking-wider text-center">Nowa Gra</h2>
            <div>
                <label for="player-count" class="block mb-1.5 text-xs font-semibold text-emerald-200/70">Liczba graczy:</label>
                <select id="player-count" class="input-field font-semibold">
                    <option value="2" selected>2 graczy</option>
                    <option value="3">3 gracze</option>
                    <option value="4">4 gracze</option>
                </select>
            </div>
            <div id="player-names-container" class="space-y-2.5"></div>
            <div class="flex flex-col sm:flex-row gap-2 pt-2">
                <button id="start-game-btn" class="btn btn-primary w-full">Rozpocznij Grę</button>
                <button id="show-load-game-btn" class="btn btn-secondary w-full">Wczytaj Grę</button>
            </div>
            <button id="show-stats-btn" class="btn btn-secondary w-full">Pokaż Statystyki</button>
        </div>

        <!-- EKRAN WCZYTYWANIA GRY -->
        <div id="load-game-screen" class="hidden card space-y-4 text-center">
            <h2 class="text-base font-bold text-emerald-400">Wczytaj zapisaną grę</h2>
            <p id="load-game-message" class="text-sm text-emerald-200/70">Sprawdzanie...</p>
            <button id="load-game-btn" class="btn btn-primary w-full hidden">Wczytaj stan gry</button>
            <button id="delete-game-btn" class="btn bg-rose-600 hover:bg-rose-700 text-white w-full hidden">Usuń zapisaną grę</button>
            <button id="back-from-load-btn" class="btn btn-secondary w-full">Wróć</button>
        </div>

        <!-- EKRAN GŁÓWNY GRY -->
        <div id="game-screen" class="hidden">
            <div id="status-message-container" class="text-center mb-3"></div>
            
            <!-- TUTAJ ZMIANA 1: Nowy przycisk zmiany gracza prowadzącego (znika po 1. rundzie) -->
            <div id="first-player-bar" class="flex justify-center mb-3">
                <button id="rotate-first-player-btn" class="btn-secondary text-xs font-bold px-3 py-1.5 flex items-center gap-1.5">
                    <span>Zmiana gracza prowadzącego</span> 🔄
                </button>
            </div>

            <div class="card space-y-3 mb-3">
                <!-- TUTAJ ZMIANA 2: Nagłówek z dodanym ID oraz domyślnym numerem rundy -->
                <h3 id="add-round-heading" class="text-xs font-bold uppercase tracking-wider text-emerald-400">Dodaj punkty za rundę: 1</h3>
                <div id="score-inputs" class="grid grid-cols-2 md:grid-cols-4 gap-2"></div>
                <button id="add-round-btn" class="btn btn-primary w-full">Zapisz Wynik Rundy</button>
            </div>

            <div id="scoreboard" class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3"></div>

            <!-- WYKRES NA ŻYWO -->
            <div id="chart-container" class="hidden card mb-3 p-0 overflow-hidden">
                <button id="chart-toggle-btn" type="button" class="chart-toggle w-full flex items-center justify-between text-left px-4 py-3" aria-expanded="false" aria-controls="chart-content">
                    <span class="text-xs font-bold uppercase tracking-wider text-emerald-300">Wykres Postępu</span>
                    <span id="chart-toggle-icon" class="text-emerald-400 text-xs">▼</span>
                </button>
                <div id="chart-content" class="hidden px-3 pb-3">
                    <div class="relative h-56 bg-emerald-950/40 p-2 rounded-xl border border-emerald-900/40">
                        <canvas id="game-chart-canvas"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="card mb-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-2">Historia Rund</h3>
                <div id="round-history-container" class="max-h-36 overflow-y-auto rounded-lg"></div>
            </div>

            <div class="flex flex-row gap-2">
                <button id="save-game-btn" class="btn btn-secondary w-1/2" disabled>Zapisz w chmurze</button>
                <button id="game-to-stats-btn" class="btn btn-secondary w-1/2">Statystyki</button>
            </div>
            <button id="back-to-menu-btn" class="btn bg-rose-950/80 hover:bg-rose-900 text-rose-200 border border-rose-800/50 w-full mt-2">Porzuć Grę</button>
        </div>

        <!-- EKRAN STATYSTYK -->
        <div id="stats-screen" class="hidden card space-y-4">
            <h2 class="text-base font-bold text-emerald-400 text-center uppercase tracking-wider">Statystyki Gier</h2>
            <div id="stats-summary" class="text-center bg-emerald-950/60 border border-emerald-800/40 p-4 rounded-xl"></div>
            <button id="back-from-stats-btn" class="btn btn-primary w-full">Wróć</button>
        </div>

        <!-- MODALE -->
        <div id="winner-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-40">
            <div class="card text-center space-y-4 max-w-lg w-full border-amber-500/50 shadow-2xl">
                <h2 class="text-2xl font-black text-amber-400 uppercase tracking-wide">Koniec Gry!</h2>
                <p id="winner-message" class="text-base font-semibold text-emerald-100"></p>
                <div id="final-scores" class="text-left space-y-1.5 text-sm bg-emerald-950/80 p-3.5 rounded-xl border border-emerald-800/50"></div>
                
                <div id="final-chart-container" class="hidden relative h-56 bg-emerald-950/40 p-2 rounded-xl mt-2 border border-emerald-800/50">
                    <canvas id="final-chart-canvas"></canvas>
                </div>

                <div class="flex flex-col gap-2 pt-2">
                    <button id="save-and-end-btn" class="btn btn-primary w-full">Zapisz wynik i zakończ</button>
                    <button id="show-final-chart-btn" class="btn btn-secondary w-full">Pokaż wykres końcowy</button>
                    <button id="correct-last-round-btn" class="btn btn-secondary w-full">Popraw ostatnią rundę</button>
                    <button id="modal-back-to-menu-btn" class="btn bg-emerald-950 hover:bg-emerald-900 text-emerald-300 w-full border border-emerald-800/50">Zakończ bez zapisywania</button>
                </div>
            </div>
        </div>
        
        <div id="confirm-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
            <div class="card text-center space-y-4 max-w-xs w-full border-emerald-800/50 shadow-2xl">
                <p id="confirm-message" class="text-sm font-medium text-emerald-100"></p>
                <div class="flex gap-2 justify-center">
                    <button id="confirm-yes-btn" class="btn bg-rose-600 hover:bg-rose-700 text-white w-1/2">Tak</button>
                    <button id="confirm-no-btn" class="btn btn-secondary w-1/2">Anuluj</button>
                </div>
            </div>
        </div>
        
        <footer class="app-footer">
            <p>Stworzone przez <strong>Łukasz Stężycki</strong>. © 2026</p>
        </footer>
    </div>

<script src="app.js"></script>
</body>
</html>
